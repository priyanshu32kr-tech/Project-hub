<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in – ProjectHub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Login form is validated by auth.js and submits credentials to the backend. -->
  <div class="auth">
    <div class="auth-form">
      <a class="brand" href="index.html" style="color:var(--text)"><span class="logo">P</span> ProjectHub</a>
      <h1 style="margin-top:24px">Welcome back!</h1>
      <p class="muted">Log in to continue.</p>
      <div id="form-error" class="alert error hidden" role="alert"></div>
      <form id="login-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
        <button class="btn btn-block" style="margin-top:22px" type="submit">Login</button>
      </form>
      <p class="muted center small" style="margin-top:18px">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
    <div class="auth-side">
      <div class="shield"><i></i></div>
      <h2>Better Teams<br />Better Projects</h2>
      <p class="muted">Join ProjectHub as the part of<br />growing community of innovators.</p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>initLogin();</script>
</body>
</html>
